[project]
name = "my-finance-mcp"
version = "0.1.0"
description = "Read-only MCP server over the my-finance database"
readme = "README.md"
authors = [
    { name = "LeonardoBringel", email = "leo.sbringel@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "cryptography>=46.0.5",
    "fastapi>=0.115.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.32.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.0",
    "isort>=6.0.1",
    "pre-commit>=4.7.0",
    "pytest>=9.0.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.black]
line-length = 80

[tool.isort]
profile = "black"
line_length = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
